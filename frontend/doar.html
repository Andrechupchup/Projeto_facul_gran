<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doar item - DoaCiclo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <a class="marca" href="index.html">
      <span class="marca-simbolo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></span>
      DoaCiclo
    </a>
    <nav class="nav" id="nav-usuario"></nav>
  </div>
</header>

<main class="pagina-media">
  <div class="cartao-form">
    <h1>Cadastrar item para doação</h1>
    <p class="subtitulo">Quanto mais detalhes, mais fácil para quem precisa entender se o item serve.</p>
    <div id="mensagem-area"></div>
    <form class="formulario" id="form-item">
      <label>Nome do item
        <input type="text" name="nome" placeholder="Ex: Geladeira Brastemp 300L" required>
      </label>
      <div class="linha">
        <label>Categoria
          <select name="categoria" required>
            <option value="Geladeira">Geladeira</option>
            <option value="Fogão">Fogão</option>
            <option value="Máquina de lavar">Máquina de lavar</option>
            <option value="Micro-ondas">Micro-ondas</option>
            <option value="Peças e componentes">Peças e componentes</option>
            <option value="Outros">Outros</option>
          </select>
        </label>
        <label>Condição
          <select name="condicao" required>
            <option value="novo">Novo</option>
            <option value="seminovo">Seminovo</option>
            <option value="usado_funcional">Usado e funcional</option>
            <option value="peca_para_reparo">Peça para reparo</option>
          </select>
        </label>
      </div>
      <label><span>Descrição <span class="opcional">(opcional)</span></span>
        <textarea name="descricao" rows="4" placeholder="Detalhes, estado de conservação, motivo da doação..."></textarea>
      </label>
      <label><span>URL de uma foto <span class="opcional">(opcional)</span></span>
        <input type="url" name="foto_url" placeholder="https://...">
      </label>
      <button class="btn" type="submit">Publicar doação</button>
    </form>
  </div>
</main>

<footer class="rodape-site">
  <div class="rodape-conteudo">
    <span><strong>DoaCiclo</strong> · Projeto Integrador</span>
    <span>Conectando doação e necessidade real.</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
const usuario = getUsuario();
if (!usuario || (usuario.tipo !== 'doador' && usuario.tipo !== 'admin')) {
  window.location.href = 'login.html';
}

document.getElementById('form-item').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const dados = Object.fromEntries(new FormData(ev.target));
  const area = document.getElementById('mensagem-area');
  try {
    await api('/itens', { method: 'POST', body: JSON.stringify(dados) });
    area.innerHTML = '<div class="mensagem sucesso">Item cadastrado com sucesso! Obrigado por doar.</div>';
    ev.target.reset();
  } catch (e) {
    area.innerHTML = `<div class="mensagem erro">${e.message}</div>`;
  }
});
</script>
</body>
</html>

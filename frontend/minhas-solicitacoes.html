<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas solicitações - DoaCiclo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <a class="marca" href="index.html">
      <span class="marca-simbolo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></span>
      DoaCiclo
    </a>
    <nav class="nav" id="nav-usuario"></nav>
  </div>
</header>

<main>
  <div class="cabecalho-pagina">
    <div>
      <h1>Minhas solicitações</h1>
      <p>Acompanhe o andamento dos itens que você pediu.</p>
    </div>
    <a class="btn secundario" href="index.html#vitrine">Ver vitrine</a>
  </div>
  <div id="conteudo"><p class="vazio">Carregando...</p></div>
</main>

<footer class="rodape-site">
  <div class="rodape-conteudo">
    <span><strong>DoaCiclo</strong> · Projeto Integrador</span>
    <span>Conectando doação e necessidade real.</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
const usuario = getUsuario();
if (!usuario || usuario.tipo !== 'beneficiario') {
  window.location.href = 'login.html';
}

async function carregar() {
  const container = document.getElementById('conteudo');
  try {
    const lista = await api('/solicitacoes');
    if (lista.length === 0) {
      container.innerHTML = '<p class="vazio">Você ainda não solicitou nenhum item. <a href="index.html#vitrine">Explore a vitrine</a>.</p>';
      return;
    }
    container.innerHTML = `
      <div class="tabela-wrap">
        <table class="tabela">
          <thead><tr><th>Item</th><th>Categoria</th><th>Status</th><th>Data</th></tr></thead>
          <tbody>
            ${lista.map(s => `
              <tr>
                <td>${s.item_nome}</td>
                <td class="texto-suave">${s.categoria}</td>
                <td><span class="badge ${s.status}">${rotuloStatus(s.status)}</span></td>
                <td class="texto-suave">${new Date(s.criado_em).toLocaleDateString('pt-BR')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    container.innerHTML = `<p class="vazio">Erro: ${e.message}</p>`;
  }
}

carregar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar - DoaCiclo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <a class="marca" href="index.html">
      <span class="marca-simbolo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></span>
      DoaCiclo
    </a>
    <nav class="nav" id="nav-usuario"></nav>
  </div>
</header>

<main class="pagina-media">
  <div class="cartao-form">
    <h1>Criar conta</h1>
    <p class="subtitulo">Leva menos de um minuto. Escolha como você quer participar.</p>
    <div id="mensagem-area"></div>
    <form class="formulario" id="form-cadastro">
      <fieldset class="opcoes-tipo">
        <legend>Tipo de conta</legend>
        <label class="opcao">
          <input type="radio" name="tipo" value="beneficiario" checked>
          <span><strong>Quero receber</strong><small>Famílias, ONGs e CRAS</small></span>
        </label>
        <label class="opcao">
          <input type="radio" name="tipo" value="doador">
          <span><strong>Quero doar</strong><small>Pessoas e empresas</small></span>
        </label>
      </fieldset>
      <label>Nome completo
        <input type="text" name="nome" autocomplete="name" required>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Senha
        <input type="password" name="senha" minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required>
      </label>
      <div class="linha">
        <label><span>Cidade <span class="opcional">(opcional)</span></span>
          <input type="text" name="cidade" autocomplete="address-level2">
        </label>
        <label><span>Telefone <span class="opcional">(opcional)</span></span>
          <input type="tel" name="telefone" autocomplete="tel">
        </label>
      </div>
      <button class="btn" type="submit">Criar conta</button>
    </form>
    <p class="rodape-form">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</main>

<footer class="rodape-site">
  <div class="rodape-conteudo">
    <span><strong>DoaCiclo</strong> · Projeto Integrador</span>
    <span>Conectando doação e necessidade real.</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
const tipoInicial = new URLSearchParams(window.location.search).get('tipo');
const opcaoInicial = document.querySelector(`input[name="tipo"][value="${tipoInicial}"]`);
if (opcaoInicial) opcaoInicial.checked = true;

document.getElementById('form-cadastro').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const dados = Object.fromEntries(new FormData(ev.target));
  const area = document.getElementById('mensagem-area');
  try {
    await api('/auth/register', { method: 'POST', body: JSON.stringify(dados) });
    area.innerHTML = '<div class="mensagem sucesso">Conta criada! Faça login para continuar.</div>';
    setTimeout(() => window.location.href = 'login.html', 1200);
  } catch (e) {
    area.innerHTML = `<div class="mensagem erro">${e.message}</div>`;
  }
});
</script>
</body>
</html>
